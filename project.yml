name: MacPDF
options:
  bundleIdPrefix: com.suthak
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MacPDF:
    type: application
    platform: macOS
    sources: [MacPDF]
    dependencies:
      - framework: Vendor/pdfium/lib/libpdfium.dylib
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suthak.MacPDF
        PRODUCT_NAME: MacPDF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: MacPDF/MacPDF-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/pdfium/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/pdfium/lib
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
    entitlements:
      path: MacPDF/MacPDF.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.print: true
    info:
      path: MacPDF/Info.plist
      properties:
        CFBundleDisplayName: MacPDF
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: PDF Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]

  MacPDFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacPDFTests
        excludes:
          - "make-fixtures.swift"
    dependencies:
      - target: MacPDF
      - framework: Vendor/pdfium/lib/libpdfium.dylib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suthak.MacPDFTests
        PRODUCT_NAME: MacPDFTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: MacPDF/MacPDF-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/pdfium/include
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/Vendor/pdfium/lib
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../Frameworks"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  MacPDF:
    build:
      targets:
        MacPDF: all
        MacPDFTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacPDFTests
